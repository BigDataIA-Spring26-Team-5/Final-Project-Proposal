[tool.poetry]
name = "food-catalog-demo"
version = "0.1.0"
description = "Food catalog data quality demo pipeline"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pandas = "*"
pyarrow = "*"
requests = "*"
dataset = "*"
datasets = "^4.8.4"
openfoodfacts = "^5.0.1"
numpy = "^2.4.4"
streamlit = ">=1.30"
dspy-ai = "*"
openai = "*"
pydantic = ">=2"
rapidfuzz = "*"
plotly = "*"
python-dotenv = "*"
structlog = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"